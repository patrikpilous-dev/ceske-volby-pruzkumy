<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volební průzkumy, průměr a mandáty, České volby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#3D4263;--navy2:#2A2E4A;--red:#C0272D;--blue:#11457E;--bg:#F7F8FB;--line:#D8DAEA;--line2:#EEF0F6;--muted:#8890B0;--text:#1E2240;--text2:#4A5070}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Source Sans 3',Verdana,sans-serif;background:transparent;color:var(--text);font-size:15px;line-height:1.45}
.w{border:1px solid var(--line);background:#fff;container-type:inline-size}
.tri{display:flex;height:6px}.tri div{flex:1}
.ser{font-family:Merriweather,Georgia,serif;font-weight:400;color:var(--navy2);line-height:1.3}
.kick{font-size:11px;letter-spacing:.08em;color:var(--red);font-weight:600;text-transform:uppercase}
.hd{padding:18px 22px 14px;border-bottom:2px solid var(--navy)}
.hd h2{font-size:24px;margin:8px 0 6px}
.lead{font-size:15px;color:var(--text2)}
.ban{display:flex;flex-wrap:wrap;gap:6px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg);align-items:center}
.ban .bl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.ban a{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;background:#fff;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px}
.ban a:hover{border-color:var(--navy)}
.ban a .dt{font-size:11px;color:var(--muted)}
.ban a.old{opacity:.6}
.g{display:grid;grid-template-columns:minmax(0,1fr)}
.g>div{padding:16px 22px}
.g>div:first-child{border-bottom:1px solid var(--line)}
.sec{padding:16px 22px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.h3{font-size:15px}
.bg{display:inline-flex}
.bg button{padding:5px 12px;font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--text2);cursor:pointer;margin-right:-1px}
.bg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.r{display:grid;grid-template-columns:160px 1fr 112px;align-items:center;gap:10px;margin:7px 0;font-size:16px}
.t{position:relative;height:26px;background:var(--bg)}
.nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hl0{visibility:hidden}
.hl{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line);flex-shrink:0}
.t .f{height:100%}
.t .c5{position:absolute;top:-2px;bottom:-2px;border-left:1px dashed var(--red)}
.v{font-weight:600}
.dl{font-weight:400;font-size:11px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.sn{display:grid;grid-template-columns:repeat(40,1fr);gap:2px}
.sn div{aspect-ratio:1}
.sn.lidi{grid-template-columns:repeat(20,1fr);gap:3px}
.sn .os{aspect-ratio:1;display:block;border:2px solid;overflow:hidden;background:#fff}
.sn .os img{width:100%;height:100%;object-fit:cover;display:block}
.sn a.os:hover{outline:2px solid var(--navy);outline-offset:1px}
.sl{font-size:13px;margin-top:8px;line-height:1.7}
.sl span{white-space:nowrap;margin-right:10px}
.sq{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.ch{cursor:pointer;user-select:none;border:1.5px solid var(--line);padding:4px 10px;font-size:13px;background:#fff;color:var(--text);display:inline-block;margin:0 5px 5px 0}
.ch.on{color:#fff}
.bar{margin-top:8px;height:10px;background:var(--line2);position:relative}
.bar .fl{height:100%;background:var(--navy);width:0;transition:width .2s}
.bar .mj{position:absolute;left:50.5%;top:-4px;bottom:-4px;width:2px;background:var(--red)}
.cw{position:relative;height:340px}
.cw2{position:relative;height:400px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ac{display:inline-flex;align-items:center;padding:4px 11px;font-size:12px;font-weight:600;border:1.5px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--text2)}
.leg .li{cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.leg .li.off{opacity:.3}
.leg .li.nd{cursor:default}
.pref{font-size:9px;background:#7B5EA7;color:#fff;padding:1px 4px;margin-left:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 22px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.meta b{color:var(--text2);font-weight:600}
.meta a{color:var(--red);font-weight:600;text-decoration:none}
.err{padding:30px 22px;color:var(--red)}
@container (max-width:780px){
  .g{grid-template-columns:1fr}
  .g>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
}
@media(max-width:560px){
  .hd,.ban,.g>div,.sec,.meta{padding-left:14px;padding-right:14px}
  .hd h2{font-size:20px}
  .r{grid-template-columns:128px 1fr 96px;font-size:14px;gap:6px}.hl{width:28px;height:28px}.t{height:20px}
  .cw{height:300px}.cw2{height:320px}
  .sn{grid-template-columns:repeat(20,1fr)}
}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="tri"><div style="background:#fff;border-bottom:1px solid var(--line)"></div><div style="background:var(--red)"></div><div style="background:var(--blue)"></div></div>
  <div class="hd">
    <div class="kick" id="kick">Průměr průzkumů</div>
    <h2 class="ser" id="head">Načítám volební průzkumy</h2>
    <div class="lead" id="lead"></div>
  </div>
  <div class="ban" id="ban"></div>

  <div class="g">
    <div>
      <div class="row">
        <h3 class="ser h3" id="t1">Volební model, průměr v %</h3>
        <div class="bg"><button class="on" id="m1a">Průměr</button><button id="m1b">Podle agentur</button></div>
      </div>
      <div id="avg"></div>
      <div class="cw" id="agw" style="display:none"><canvas id="c1" role="img" aria-label="Poslední průzkum každé agentury podle stran"></canvas></div>
      <div class="leg" id="leg1" style="display:none"></div>
      <div class="note" id="n1"></div>
    </div>
    <div>
      <div class="row"><h3 class="ser h3">Sněmovna, 200 křesel</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><div class="bg"><button class="on" id="sn1">Podle průzkumů</button><button id="sn2">Současná</button></div><div class="bg"><button class="on" id="sl1">Strany</button><button id="sl2">Politici</button></div></div></div>
      <div class="note" id="snp" style="margin:-4px 0 8px"></div>
      <div class="sn" id="sn" aria-label="Rozdělení 200 mandátů"></div>
      <div class="sl" id="sl"></div>
      <h3 class="ser h3" style="margin:16px 0 8px">Sestavte koalici</h3>
      <div id="chips"></div>
      <div class="bar"><div class="fl" id="fl"></div><div class="mj" title="Většina 101"></div><div class="mj" style="left:60%;background:#11457E" title="Ústavní většina 120"></div></div><div style="position:relative;height:14px;font-size:10.5px;color:#8890B0"><span style="position:absolute;left:50.5%;transform:translateX(-50%)">101</span><span style="position:absolute;left:60%;transform:translateX(-50%)">120</span></div>
      <div id="res" style="font-size:14px;margin-top:6px"></div>
    </div>
  </div>

  <div class="sec">
    <div class="row">
      <h3 class="ser h3">Vývoj preferencí v čase</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="bg" id="per"><button data-p="12">12 měsíců</button><button data-p="volby" class="on">Od voleb 2025</button><button data-p="vse">Od 2022</button></div>
        <div class="bg"><button class="on" id="v2p">Strany</button><button id="v2c">Koalice</button></div>
      </div>
    </div>
    <div class="chips" id="af"></div>
    <div class="cw2"><canvas id="c2" role="img" aria-label="Vývoj volebních preferencí v čase"></canvas></div>
    <div class="leg" id="leg2"></div>
    <div class="note" id="n2"></div>
  </div>

  <div class="meta" id="meta"></div>
</div>
<script src="hp.js"></script>
</body>
</html>
